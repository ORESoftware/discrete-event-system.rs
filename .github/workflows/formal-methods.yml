name: Formal methods

on:
  pull_request:
    paths:
      - 'src/bin/formal_benchmark_validation_reference.rs'
      - 'src/bin/proof_validation_reference.rs'
      - 'src/des/general/external_validation_tools.rs'
      - 'src/des/runners/**'
      - 'scripts/formal_benchmark_validation_reference.py'
      - 'scripts/proof_validation_reference.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/formal-methods.yml'
  push:
    branches: [main]
    paths:
      - 'src/bin/formal_benchmark_validation_reference.rs'
      - 'src/bin/proof_validation_reference.rs'
      - 'src/des/general/external_validation_tools.rs'
      - 'src/des/runners/**'
      - 'scripts/formal_benchmark_validation_reference.py'
      - 'scripts/proof_validation_reference.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/formal-methods.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-formal-validation:
    name: Rust proof and model validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test proof validator
        run: cargo test --locked --bin proof_validation_reference

      - name: Test formal benchmark validator
        run: cargo test --locked --bin formal_benchmark_validation_reference

      - name: Test formal tool adapters
        run: cargo test --locked --lib formal
