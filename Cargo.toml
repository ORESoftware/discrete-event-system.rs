[package]
name = "discrete_event_system_rs"
version = "0.1.0"
edition = "2021"
description = "Rust migration of the ORE discrete event system TypeScript codebase"
license = "UNLICENSED"
publish = false

[lib]
name = "discrete_event_system_rs"
path = "src/lib.rs"

[features]
default = []
cli = ["dep:clap"]
http = ["dep:axum", "dep:tokio", "dep:tower-http"]
websocket = ["dep:tokio", "dep:tokio-tungstenite"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", optional = true }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"], optional = true }
indexmap = { version = "2", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
ordered-float = { version = "4", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
approx = "0.5"
