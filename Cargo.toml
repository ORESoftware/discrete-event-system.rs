[package]
name = "des_engine"
version = "0.0.1"
edition = "2021"
description = "Library/SDK for modeling, simulating, solving, and rendering discrete, continuous, and mixed systems (Rust port of the TypeScript des-engine)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ores/discrete-event-system.rs"
keywords = ["simulation", "discrete-event", "control-systems", "mdp", "solver"]
categories = ["simulation", "science", "mathematics"]

# `cargo doc` / docs.rs builds the library only; the 90+ demo bins under
# src/bin/ are runnable simulations, not part of the SDK API surface.
[package.metadata.docs.rs]
no-default-features = false

# The TypeScript source maps 1:1 onto this crate:
#   src/des/<path>.ts  ->  src/des/<path>.rs
#   index.ts           ->  mod.rs
# Foundation modules (des::shared::*) are dependency-free and ported first.
[dependencies]
# Exact base-10 decimal arithmetic for COMPOUND bookkeeping that must not drift
# (the DES simulation clock, money/markets, routing probabilities, RV algebra) —
# the faithful Rust analog of the TypeScript engine's `mathjs.BigNumber`.
# `maths` enables powi/powd/exp/ln; `macros` provides the `dec!()` literal.
# Numerical kernels (linalg/optim/ODE/LP/eigen/stats) deliberately stay on `f64`.
rust_decimal = { version = "1.42.0", default-features = false, features = ["maths", "std"] }
rust_decimal_macros = "1.40.0"
# Exact rationals (p/q) for the rare spots the TS used `Fraction`.
# `num-bigint-std` enables the arbitrary-precision `BigRational`.
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint-std", "std"] }
num-traits = { version = "0.2.19", default-features = false }
# Entity ids / short UUIDs (`uuid.v4().slice(-10)` in the TS entity framework).
uuid = { version = "1", features = ["v4"] }
# JSON (de)serialization for the framework artifacts the TS writes via `fs`
# (`out/*-framework.json`) and for the external-reference payloads the
# `validate_*` runners parse. The crate's core stays on its own serde-free
# `JsonValue`; serde is used only at the I/O boundary, bridged to `JsonValue`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }

[features]
# Enables the GpuBatchBackend registration hook (no external GPU crate bundled).
evolution-gpu = []

[dev-dependencies]
