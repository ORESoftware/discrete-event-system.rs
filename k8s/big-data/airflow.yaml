apiVersion: v1
kind: Secret
metadata:
  name: airflow-admin
  namespace: big-data
type: Opaque
stringData:
  username: admin
  password: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: big-data
data:
  big_data_smoke_dag.py: |
    from datetime import datetime

    from airflow.decorators import dag, task


    @dag(
        dag_id="big_data_smoke",
        start_date=datetime(2024, 1, 1),
        schedule=None,
        catchup=False,
        tags=["big-data", "smoke"],
    )
    def big_data_smoke():
        @task
        def hello():
            return "Spark, Airflow, and MinIO are deployed."

        hello()


    big_data_smoke()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: big-data
  labels:
    app.kubernetes.io/name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
    spec:
      containers:
        - name: airflow
          image: docker.io/apache/airflow:2.10.5
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
          args:
            - |
              airflow db migrate
              airflow users create \
                --username "${AIRFLOW_ADMIN_USERNAME}" \
                --password "${AIRFLOW_ADMIN_PASSWORD}" \
                --firstname Big \
                --lastname Data \
                --role Admin \
                --email admin@example.local || true
              airflow scheduler &
              exec airflow webserver --port 8080
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: SequentialExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: sqlite:////opt/airflow/airflow.db
            - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
              value: "true"
            - name: AIRFLOW_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: username
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: password
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: airflow-home
              mountPath: /opt/airflow
            - name: dags
              mountPath: /opt/airflow/dags
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: web
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 8
      volumes:
        - name: airflow-home
          emptyDir: {}
        - name: dags
          configMap:
            name: airflow-dags
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: big-data
  labels:
    app.kubernetes.io/name: airflow
spec:
  selector:
    app.kubernetes.io/name: airflow
  ports:
    - name: web
      port: 8080
      targetPort: web

