apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-soccer-learning-rds-smoke
  namespace: default
  labels:
    app: dd-soccer-learning-rds-smoke
    app.kubernetes.io/name: dd-soccer-learning-rds-smoke
    app.kubernetes.io/part-of: des-soccer-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-soccer-learning-rds-smoke
  template:
    metadata:
      labels:
        app: dd-soccer-learning-rds-smoke
        app.kubernetes.io/name: dd-soccer-learning-rds-smoke
        app.kubernetes.io/part-of: des-soccer-learning
    spec:
      automountServiceAccountToken: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 20
      containers:
        - name: soccer-learning
          image: 710156900967.dkr.ecr.us-east-1.amazonaws.com/des-soccer-learning:codex-rds-smoke-20260604
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - |
              if /usr/local/bin/main_soccer_learning_run; then
                echo "soccer learning smoke complete; keeping pod alive for log inspection"
                sleep 86400
              else
                status=$?
                echo "soccer learning smoke failed with status ${status}" >&2
                exit "${status}"
              fi
          env:
            - name: SOCCER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dd-remote-rest-api-secrets
                  key: RDS_DATABASE_URL
            - name: SOCCER_RUN_ID
              value: codex-k8s-pg-smoke-20260604
            - name: SOCCER_EXPERIMENT_SLUG
              value: soccer-self-play-k8s-smoke
            - name: SOCCER_EXPERIMENT_NAME
              value: Soccer self-play k8s smoke
            - name: SOCCER_GAMES
              value: "25"
            - name: SOCCER_PARALLEL_GAMES
              value: "5"
            - name: SOCCER_HALVES
              value: "2"
            - name: SOCCER_HALF_MINUTES
              value: "45"
            - name: SOCCER_MINUTES
              value: "90"
            - name: SOCCER_PERIOD_BREAK_RECOVERY_SECONDS
              value: "900"
            - name: SOCCER_DT_SECONDS
              value: "5"
            - name: SOCCER_LEARNING_INTERVAL_TICKS
              value: "4"
            - name: SOCCER_POSTGRES_POLICY_VERSION_INTERVAL_GAMES
              value: "5"
            - name: SOCCER_POSTGRES_COMPLETED_RUN_BATCH_GAMES
              value: "5"
            - name: SOCCER_POSTGRES_COMPLETED_RUN_RETENTION_GAMES
              value: "200"
            - name: SOCCER_POSTGRES_ASYNC_BATCH_QUEUE
              value: "4"
            - name: SOCCER_POSTGRES_TACTICAL_LEARNING_AUTHORITATIVE
              value: "true"
            - name: SOCCER_POSTGRES_REFRESH_WITH_RESUME_ARTIFACT
              value: "true"
            - name: SOCCER_POSTGRES_FLUSH_POLICY_VERSIONS_BEFORE_NEW_SIM
              value: "true"
            - name: SOCCER_EVOLUTION_ENABLED
              value: "true"
            - name: SOCCER_EVOLUTION_INTERVAL_GAMES
              value: "5"
            - name: SOCCER_EVOLUTION_ELITE_GAMES
              value: "4"
            - name: SOCCER_EVOLUTION_POPULATION_SIZE
              value: "8"
            - name: SOCCER_CHECKPOINT_INTERVAL_GAMES
              value: "0"
            - name: SOCCER_GAME_ARTIFACT_MODE
              value: summary
            - name: SOCCER_WRITE_GAME_ARTIFACTS
              value: "false"
            - name: SOCCER_WRITE_FINAL_ARTIFACTS
              value: "false"
            - name: SOCCER_WRITE_FINAL_POLICY_ARTIFACT
              value: "false"
            - name: SOCCER_WRITE_CHECKPOINT_ARTIFACTS
              value: "false"
            - name: SOCCER_WRITE_EPISODE_LOG
              value: "false"
            - name: SOCCER_REQUIRE_POSTGRES
              value: "true"
            - name: SOCCER_RUN_DIR
              value: /tmp/soccer-learning
            - name: SOCCER_ARTIFACT_PATH
              value: /dev/null
            - name: SOCCER_CHECKPOINT_ARTIFACT_PATH
              value: /dev/null
            - name: SOCCER_EPISODE_LOG_PATH
              value: /dev/null
            - name: SOCCER_LEARNED_PARAMS_PATH
              value: /dev/null
          resources:
            requests:
              cpu: 1500m
              memory: 2Gi
            limits:
              cpu: "5"
              memory: 8Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
