apiVersion: batch/v1
kind: Job
metadata:
  name: soccer-learning-run
  namespace: des-soccer-learning
  labels:
    app.kubernetes.io/name: des-soccer-learning
    app.kubernetes.io/component: trainer
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: des-soccer-learning
        app.kubernetes.io/component: trainer
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: des-soccer-learning:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
          args:
            - |
              export SOCCER_RUN_ID="${SOCCER_RUN_ID:-soccer-learning-$(date +%Y%m%d%H%M%S)}"
              export SOCCER_RUN_DIR="${SOCCER_RUN_DIR:-/data/soccer-learning/${SOCCER_RUN_ID}}"
              export SOCCER_ARTIFACT_PATH="${SOCCER_ARTIFACT_PATH:-${SOCCER_RUN_DIR}/final-policy.json}"
              exec main_soccer_learning_run
          env:
            - name: SOCCER_GAMES
              value: "100"
            - name: SOCCER_PARALLEL_GAMES
              value: "4"
            - name: SOCCER_MINUTES
              value: "90"
            - name: SOCCER_HALVES
              value: "2"
            - name: SOCCER_HALF_MINUTES
              value: "45"
            - name: SOCCER_DT_SECONDS
              value: "0.2"
            - name: SOCCER_LEARNING_INTERVAL_TICKS
              value: "4"
            - name: SOCCER_HALFTIME_FATIGUE_RECOVERY
              value: "0.18"
            - name: SOCCER_GAME_ARTIFACT_MODE
              value: summary
            - name: SOCCER_WRITE_GAME_ARTIFACTS
              value: "true"
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
          volumeMounts:
            - name: artifacts
              mountPath: /data
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: soccer-learning-artifacts
